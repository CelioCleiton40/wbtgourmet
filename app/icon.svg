<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E17"/>
      <stop offset="100%" stop-color="#060C09"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Circular com Borda Gourmet Verde Esmeralda -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />
  
  <!-- Anel Interno Fino Dourado -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="8 6"/>

  <!-- Ícone Cloche Gourmet Superior em Ouro -->
  <g transform="translate(0, -10)">
    <!-- Pegador da Cloche -->
    <circle cx="256" cy="115" r="14" fill="url(#goldGrad)" />
    <!-- Cúpula da Cloche -->
    <path d="M 160 190 C 160 135, 352 135, 352 190 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Base da Cloche -->
    <rect x="144" y="196" width="224" height="12" rx="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Monograma WBT Centralizado -->
  <text x="256" y="325" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="108" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        text-anchor="middle"
        filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.8))">
    WBT
  </text>

  <!-- Subtítulo GOURMET -->
  <text x="256" y="375" 
        font-family="'Manrope', 'Montserrat', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="12" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.6))">
    GOURMET
  </text>

  <!-- Estrelas Decorativas -->
  <polygon points="256,410 260,422 272,422 262,430 266,442 256,434 246,442 250,430 240,422 252,422" fill="url(#goldGrad)" />
  <polygon points="216,416 219,425 228,425 221,431 224,440 216,434 208,440 211,431 204,425 213,425" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="296,416 299,425 308,425 301,431 304,440 296,434 288,440 291,431 284,425 293,425" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
